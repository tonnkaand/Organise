name: Organise - Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    name: Tests Java et qualité du code
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Exécuter les tests Java et JaCoCo
        run: mvn -B clean verify

      - name: Exécuter les tests de mutation PIT
        run: mvn -B test-compile org.pitest:pitest-maven:mutationCoverage

      - name: Installer les dépendances Node.js
        run: npm ci

      - name: Installer Chromium et ses dépendances système
        run: npx playwright install --with-deps chromium

      - name: Exécuter les tests navigateur Playwright
        run: npm run test:e2e

      - name: Publier les rapports de qualité
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapports-qualite
          if-no-files-found: ignore
          path: |
            target/site/jacoco/
            target/pit-reports/

      - name: Publier les rapports Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapports-playwright
          if-no-files-found: ignore
          path: |
            playwright-report/
            test-results/
